<!-- hero-brand.svg — 대문 배너 / 대시보드 상단 그림 (원본 일러스트, 글자 없음 → 어떤 글꼴 환경에서도 깨지지 않음)
     구성: 네이비 그라데이션 배경 + 격자 + 인증별 간트 막대(준비 파랑→기관 심사 주황→피드백 보라→발급 초록, 앱 간트와 같은 색)
     + 오른쪽 큰 갱신 링/체크(로고 모티프) + 점 3개(상태 신호: 빨강·주황·초록).
     타사 로고·사진을 쓰지 않아 외부 공개 시 저작권/상표 문제가 없음. -->
