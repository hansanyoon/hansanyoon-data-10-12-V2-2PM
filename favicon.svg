<!-- favicon.svg — 브라우저 탭/즐겨찾기 아이콘 (plan.html 이 이미 이 파일을 가리키는데 없어서 404 였음 → 신규 작성)
     디자인: 네이비→오션블루 라운드 사각 + 갱신 화살표(순환 = 갱신 주기) + 체크(인증). 작은 크기에서도 읽히도록 선을 굵게. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="인증 갱신 관리">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12457A"/><stop offset="1" stop-color="#0A66B2"/></linearGradient></defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="80 27" transform="rotate(-50 32 32)"/>
  <polygon points="22.06,17.33 14.46,19.49 21.40,25.21" fill="#fff"/>
  <polyline points="25,33 30,38 40,26" fill="none" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
